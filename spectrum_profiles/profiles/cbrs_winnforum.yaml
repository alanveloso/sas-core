id: cbrs_winnforum
version: "1.0.0"
description: >
  Default CBRS band profile aligned with WInnForum SAS baseline
  (3550–3700 MHz). Protection parameters are generic and versioned;
  RF algorithms consume them without fixture-specific hardcodes.
rule_applied: winnforum_cbrs_baseline_v1
band_plan:
  low_hz: 3550000000
  high_hz: 3700000000
  unit: Hz
protections:
  - name: peer_esc
    enabled: true
    params:
      radius_m: 40000
      low_hz: 3550000000
      high_hz: 3700000000
  - name: peer_ppa
    enabled: true
    params:
      buffer_m: 1000
entities:
  - entity_type: esc
    params:
      default_protection_radius_m: 40000
  - entity_type: ppa
    params:
      default_buffer_m: 1000
  - entity_type: fss
    params:
      co_channel_protection_enabled: true
