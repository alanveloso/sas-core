[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "spectrum-access-system"
version = "0.1.0"
description = "Spectrum Access System for CBRS / WInnForum interoperability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "spectrum-access-system contributors" }]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "sqlalchemy==2.0.51",
  "alembic==1.16.4",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "psycopg2-binary==2.9.12",
  "celery==5.6.3",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
  "shapely==1.7.1",
]

[project.entry-points."spectrum_access.device_adapters"]
mapping = "adapters.device:MappingDeviceAdapter"

[project.entry-points."spectrum_access.network_adapters"]
mapping = "adapters.device:MappingNetworkAdapter"

[project.entry-points."spectrum_access.protocol_adapters"]
generic_json = "adapters.protocol:GenericJsonProtocolAdapter"

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "coverage==7.10.2",
  "freezegun==1.5.2",
  "ruff==0.12.8",
  "mypy==1.17.1",
  "types-PyYAML==6.0.12.20250822",
]

[tool.setuptools]
py-modules = ["main", "config", "database", "celery_app", "tasks"]

[tool.setuptools.packages.find]
include = [
  "models*",
  "routes*",
  "schemas*",
  "services*",
  "spectrum_profiles*",
  "protection_data*",
  "tools*",
  "compliance*",
  "primitives*",
  "adapters*",
  "providers*",
]

[tool.setuptools.package-data]
spectrum_profiles = ["profiles/*.yaml", "profiles/*.yml", "profiles/*.json"]
protection_data = ["manifests/*.yaml", "manifests/*.yml"]
compliance = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Parallel pytest workers are intentionally not configured: database.engine /
# SessionLocal are process-global. Enable after shared state is removed.
markers = [
  "integration: crosses process/Docker boundaries",
  "contract: Admin/harness path contracts",
  "security: certificate and doctor checks",
]

[tool.coverage.run]
branch = true
source = [
  "main",
  "config",
  "database",
  "models",
  "routes",
  "schemas",
  "services",
  "spectrum_profiles",
  "protection_data",
  "tools",
  "primitives",
  "adapters",
  "providers",
]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true

[tool.ruff]
target-version = "py311"
line-length = 100
extend-exclude = [".venv", "artifacts", ".cache"]

[tool.ruff.lint]
# Keep CI lint focused on correctness; avoid mass I/UP churn on legacy modules.
select = ["E", "F"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"main.py" = ["E402"]
"tasks.py" = ["E402"]
"celery_app.py" = ["E402"]

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
pretty = true
files = ["compliance", "tools"]
