[build-system]
requires = ["setuptools==75.8.2", "wheel==0.45.1"]
build-backend = "setuptools.build_meta"

[project]
name = "sas-core"
version = "0.1.0"
description = "Spectrum Access System core for CBRS / WInnForum interoperability"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "sas-core contributors" }]
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.1",
  "sqlalchemy==2.0.51",
  "pydantic==2.13.4",
  "pydantic-settings==2.14.2",
  "psycopg2-binary==2.9.12",
  "celery==5.6.3",
  "cryptography==50.0.0",
  "httpx==0.28.1",
  "PyYAML==6.0.3",
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "pytest-cov==6.2.1",
  "coverage==7.10.2",
  "freezegun==1.5.2",
]

[tool.setuptools]
py-modules = ["main", "config", "database", "celery_app", "tasks"]

[tool.setuptools.packages.find]
include = ["models*", "routes*", "schemas*", "services*", "spectrum_profiles*", "tools*", "compliance*"]

[tool.setuptools.package-data]
compliance = ["*.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
# Parallel pytest workers are intentionally not configured: database.engine /
# SessionLocal are process-global. Enable after shared state is removed.
markers = [
  "integration: crosses process/Docker boundaries",
  "contract: Admin/harness path contracts",
  "security: certificate and doctor checks",
]

[tool.coverage.run]
branch = true
source = [
  "main",
  "config",
  "database",
  "models",
  "routes",
  "schemas",
  "services",
  "spectrum_profiles",
  "tools",
]
omit = ["tests/*", "*/__pycache__/*"]

[tool.coverage.report]
show_missing = true
skip_empty = true
