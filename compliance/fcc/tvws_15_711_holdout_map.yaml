  - id: CR-1
    rule: "Do not open a new core abstraction solely because TVWS needs it."
  - id: CR-2
    rule: "query_assignment may be cited only as already OPEN_FOR_LATER_DESIGN (G9-006 IF-001); do not register here."
  - id: CR-3
    rule: "Do not hardcode Mode I/II/Fixed as Coordination Core nouns."
  - id: CR-4
    rule: "Do not invent TVWS geometries or FCC database contents."

