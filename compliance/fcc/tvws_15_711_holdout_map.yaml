    source: CFR_47_15_711
    section: "Protected services (via §15.712)"
    summary: "Protection of TV, wireless mics, MVPD, WMTS, RAS, 600 MHz licensees, border areas — realized through database rules, not core hardcoding."
    profile_field: "protection + data.protected_entities; FCC/database packs"
