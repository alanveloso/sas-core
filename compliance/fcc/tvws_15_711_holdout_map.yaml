    summary: "TVWS §15.711 was reserved as holdout and must not reshape frozen G0–G9 interfaces in G10-001."
    profile_field: "holdout map only; profile_id_target deferred"
    mechanisms: []
    code_plugin: null
    test: "MATRIX_TEST"
    status: MATRIX_TEST
    fit_verdict: N_A

  - id: TVWS-002
    source: CFR_47_15_711
    section: "Database query — fixed / Mode II"
    summary: "Device must obtain available channels and corresponding maximum permitted power for its location from a white space database (Internet)."
    profile_field: "authorization.mechanism=query_assignment (deferred; G9-006 OPEN_FOR_LATER_DESIGN)"
    mechanisms: []
    deferred_mechanisms:
      - query_assignment
    code_plugin: null
    test: "MATRIX_TEST"
    status: GAP_PRIMITIVE
    fit_verdict: GAP
    notes: "Same shape as AFC/UK maps; does not invent a third primitive. Do not register in G10-001."

  - id: TVWS-003
    source: CFR_47_15_711
    section: "(b) Geo-location"
    summary: "Fixed (with geo capability) and Mode II must determine location and uncertainty (metres) at 95% confidence."
    profile_field: "device adapter geolocation capability; point_radius for uncertainty ball"
    mechanisms:
      - point_radius
    code_plugin: "device ConsumerAdapter"
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL

  - id: TVWS-004
    source: CFR_47_15_711
    section: "Fixed — antenna height"
    summary: "Fixed-device database query considers antenna height above ground level."
    profile_field: "antenna_height_limit / rule_table height bands as query input params"
    mechanisms:
      - antenna_height_limit
      - rule_table
    deferred_mechanisms:
      - query_assignment
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL

  - id: TVWS-005
    source: CFR_47_15_711
    section: "Mode II — location recheck"
    summary: "Mode II checks location at least every 60 s while operating; re-query database if moved >100 m."
    profile_field: "device adapter + periodic/event reevaluation; not CBRS heartbeat-inside-lease"
    mechanisms:
      - periodic
    deferred_mechanisms:
      - query_assignment
    code_plugin: "device adapter"
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL
    notes: "Timing is device/ops; assignment remains query_assignment when registered later."

  - id: TVWS-006
    source: CFR_47_15_713
    section: "Available channels + 48-hour schedule"
    summary: "Database returns channel availability including scheduled changes over a 48-hour horizon from recheck contact."
    profile_field: "query_assignment result (+ optional availability_constraint for scheduled windows)"
    mechanisms:
      - availability_constraint
      - channel_exclusion
    deferred_mechanisms:
      - query_assignment
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL
    notes: "Do not overload availability_constraint as the sole AFC/TVWS query mechanism (G9-006 IF-002)."

