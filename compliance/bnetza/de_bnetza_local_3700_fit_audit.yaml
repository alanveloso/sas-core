    section: "10-MHz-Blöcke"
    summary: "Assignment in integer multiples of 10 MHz; fee schedule cites min 10 / max 100 MHz."
    profile_field: "fixed_width_channelization (10 MHz) + max_assignment_bandwidth"
    mechanisms:
      - fixed_width_channelization
      - max_assignment_bandwidth
      - frequency_ranges
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT
    contrast:
      br_anatel_slp_3700: "BR outdoor consigned BW ≤50 MHz (Ato 915); DE allows up to 100 MHz per fee schedule"

  - id: DE-LOC-006
    source: BNETZA_VV_LOKALES_BREITBAND_3700
    section: "Anlage 2 — TDD"
    summary: "Duplex mode is TDD."
