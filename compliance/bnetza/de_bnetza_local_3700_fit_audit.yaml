    mechanisms:
      - duplex_mode
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT

  - id: DE-LOC-007
    source: BNETZA_VV_LOKALES_BREITBAND_3700
    section: "Anlage 2 — keine blockinternen BS-EIRP"
    summary: "No prescribed in-block EIRP limits for base stations (unlike BR indoor/outdoor PSD caps)."
    profile_field: "omit BR-style max_power BS rows; do not import Ato 915 EIRP into DE profile"
    mechanisms: []
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
