requirements:
  - id: DE-LOC-001
    source: BNETZA_VV_LOKALES_BREITBAND_3700
    section: "Band 3.700–3.800 MHz"
    summary: "Local campus assignments use 3700–3800 MHz — the same numeric band as ANATEL SLP / br_anatel_slp_3700."
    profile_field: "spectrum.ranges"
    mechanisms:
      - frequency_ranges
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT
    notes: "Shared Hz range is necessary but not sufficient for profile identity."

  - id: DE-LOC-002
    source: PLAN_CHALLENGE
    section: "Same band ≠ same profile"
    summary: "Germany local/campus must remain a distinct challenge (de_bnetza_local_3700); must not reuse or alias br_anatel_slp_3700 despite identical 3700–3800 MHz."
    profile_field: "challenge_id=de_bnetza_local_3700 ≠ br_anatel_slp_3700"
    mechanisms:
      - frequency_ranges
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT
    contrast:
      br_anatel_slp_3700: "Same band; different authority, power, height, outdoor BW, protection tables"

  - id: DE-LOC-003
    source: BNETZA_VV_LOKALES_BREITBAND_3700
    section: "Frequenzzuteilungsgebiet / Grundstück"
    summary: "Assignments are local (property/campus/Betriebsgelände), not nationwide MNO blocks in 3.4–3.7."
    profile_field: "geography.authorized_area + static_authorization"
    mechanisms:
