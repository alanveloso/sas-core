    notes: "Absence of a limit is configuration; copying BR power tables would be a regime error."

  - id: DE-LOC-008
    source: G5_ACIA_DE
    section: "UE power (secondary)"
    summary: "Secondary guidance cites UE limit 28 dBm TRP; BR SLP terminal max is 26 dBm (+tol)."
    profile_field: "rule_table device_class=terminal (DE values, not BR)"
    mechanisms:
      - rule_table
      - max_power
    code_plugin: null
