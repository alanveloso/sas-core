# G11-004 — Release gate + evidence package (claims limited to evidence).
# Does NOT run the WInnForum official harness (that is G11-005 via /run-winnforum-gate).
# Does NOT authorize PASS_OFFICIAL or third-party certification claims.
version: 1
matrix_id: G11-004
phase: G11
dependencies: G11-003
deliverable: "Release reproduzível e claims limitados à evidência"

uut:
  branch: generalization/g2
  # SHA at package authoring (pre-commit of this task). Release pin = commit that includes this package.
  package_authoring_head: "8d3a8cb026cff570a7c24f1a42986f03bac196bf"
  pin_policy: >
    After this package is committed, the release-candidate UUT SHA is that commit.
    Re-verify with: python -m tools.g11_004_release_gate --verify
  request_path_profile: cbrs_winnforum
  profile_v2_ids:
    - cbrs_winnforum
    - br_anatel_slp_3700
    - eu_elsa
    - us_tvws_15_711

official_harness:
  gate_for_final_campaign: G11-005
  invoke_via: "/run-winnforum-gate G11-005"
  g5_009_evidence: compliance/evidence/G5-009_official_regression.md
  g5_009_pass_official_claim_supported: false
  g5_009_overall_classification: BLOCKED
  pass_official_claim_supported_by_this_package: false

claims_allowed:
  - "Local Profile v2 loads/doctor PASS for listed reference profiles"
  - "Local multi-profile regression axes (G11-002) exercised"
  - "Loader/plugin trust hardening documented (G11-001)"
  - "Authoring docs present (G11-003)"
  - "Quantitative reuse metrics recorded (G10-003); TVWS CONDITIONAL retained"
  - "G5-009 official campaign evidence exists and does not support PASS_OFFICIAL"

claims_forbidden:
  - PASS_OFFICIAL
  - "formal third-party certification"
  - "FCC certified"
  - "Anatel certified"
  - "WInnForum certified"
  - "rewrite CONDITIONAL/PARTIAL/GAP to PASS without new evidence"

local_evidence_inventory:
  - task: G9-006
    path: compliance/generalization/g9_006_interface_review.yaml
  - task: G10-001
    path: compliance/fcc/tvws_15_711_holdout_map.yaml
  - task: G10-002
    path: compliance/fcc/g10_002_holdout_verdict.yaml
    notes: "verdict CONDITIONAL — retained as evidence"
  - task: G10-003
    path: compliance/generalization/g10_003_quantitative_report.yaml
  - task: G11-001
    path: compliance/generalization/g11_001_loader_plugin_trust.yaml
  - task: G11-002
    path: compliance/generalization/g11_002_multi_profile_regression.yaml
  - task: G11-003
    path: compliance/generalization/g11_003_authoring_docs.yaml
  - task: G5-009
    path: compliance/evidence/G5-009_official_regression.md
    notes: "official harness evidence; PASS_OFFICIAL=NO"

local_gate_tests:
  - tests/unit/test_g11_001_loader_plugin_trust.py
  - tests/unit/test_g11_002_multi_profile_regression.py
  - tests/unit/test_g11_003_authoring_docs.py
  - tests/unit/test_g10_002_tvws_holdout_representation.py
  - tests/unit/test_g10_003_quantitative_report.py
  - tests/unit/test_g8_005_three_regime_regression.py

reproducibility_checklist:
  - "git checkout <release-candidate-sha>"
  - "python3 -m venv .venv && source .venv/bin/activate && pip install -r requirements.lock.txt && pip install -e ."
  - "python -m tools.g11_004_release_gate --verify"
  - "pytest -q tests/unit/test_g11_004_release_gate.py + local_gate_tests listed above"
  - "Do not claim PASS_OFFICIAL until /run-winnforum-gate G11-005 succeeds with stored evidence"

architecture_invariants:
  core_country_profile_branches: false
  yaml_dsl_introduced: false
  query_assignment_registered: false
  tvws_holdout_verdict: CONDITIONAL

non_goals:
  - Execute G11-005 official campaign in this task
  - Invent PASS_OFFICIAL
  - Register query_assignment
  - Coordination Core country branching
