# G11-002 — Multi-profile performance/regression campaign.
# Determinism, concurrency, timezones, datasets. Not WInnForum PASS_OFFICIAL.
version: 1
matrix_id: G11-002
phase: G11
dependencies: G11-001
deliverable: "Determinismo, concorrência, timezones e datasets"
core_country_profile_branches: false
yaml_dsl_introduced: false
query_assignment_registered: false

profiles_in_campaign:
  - profile_id: cbrs_winnforum
    role: reference_cbrs
  - profile_id: br_anatel_slp_3700
    role: reference_br
  - profile_id: eu_elsa
    role: reference_elsa
  - profile_id: us_tvws_15_711
    role: holdout_conditional
    representation_verdict: CONDITIONAL
    notes: "Included as loadable Profile v2; CONDITIONAL retained as evidence (G10-002/G10-003)."

axes:
  - id: determinism
    checks:
      - stable_profile_hash_across_repeated_loads
      - hash_invariant_under_process_timezone_env
  - id: concurrency
    checks:
      - concurrent_multi_profile_loads_preserve_hashes
      - no_cross_profile_context_contamination
  - id: timezones
    checks:
      - UtcInstant_rejects_naive_datetime
      - TimeInterval_equality_after_offset_normalization_to_utc
  - id: datasets
    checks:
      - ProfileContext_records_required_data_capabilities
      - doctor_fail_closed_when_require_data_plugins_without_providers

performance_budget:
  description: "Sequential load + hash + doctor(check_plugins=False) for all four profiles."
  max_wall_seconds: 5.0

prior_local_regression:
  - tests/unit/test_g7_005_multi_profile_regression.py
  - tests/unit/test_g8_005_three_regime_regression.py

non_goals:
  - WInnForum official harness (G11-005 /run-winnforum-gate)
  - Register query_assignment
  - Coordination Core country branching
  - ORM mass rename
  - Rewrite TVWS CONDITIONAL to PASS
