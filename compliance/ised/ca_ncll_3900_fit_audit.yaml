      - "37 dBm/MHz medium power (landing summary)"

  - id: CA-NCLL-008
    source: ISED_NCLL_LANDING
    section: "Indoor / urban EIRP caps"
    summary: "Indoor-exclusive and urban/metro operations use lower watt-per-block EIRP caps (e.g. 1 W / 10 MHz)."
    profile_field: "rule_table closed selectors indoor_outdoor + area_class"
    mechanisms:
      - rule_table
      - max_power
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT

  - id: CA-NCLL-009
    source: ISED_NCLL_LANDING
    section: "Antenna height"
    summary: "Urban/metro antenna height limit 10 m; rural/remote options include higher height with lower or higher EIRP options."
