requirements:
  - id: CA-NCLL-001
    source: ISED_NCLL_LANDING
    section: "3900 MHz band plan"
    summary: "NCLL mid-band product is 3900–3980 MHz in 10 MHz blocks A1–A8 (10 or contiguous 20 MHz per application)."
    profile_field: "spectrum.ranges + optional fixed_width_channelization (10 MHz)"
    mechanisms:
      - frequency_ranges
      - fixed_width_channelization
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT

  - id: CA-NCLL-002
    source: ISED_R3_NCLL_3900
    section: "1. Licence term"
    summary: "Annual renewable local licence (high expectation of renewal) or temporary non-renewable face date — not CBRS dynamic grant/heartbeat."
    profile_field: "authorization.mechanism=static_authorization (+ fixed_window outer cap)"
    mechanisms:
      - static_authorization
      - fixed_window
    forbid_mechanisms_as_keepalive:
      - dynamic_lease
      - periodic
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT

  - id: CA-NCLL-003
    source: ISED_R3_NCLL_3900
    section: "11–12 Deployment / technical"
    summary: "Entitlement: licensee may deploy stations anywhere inside the licensed area on assigned blocks; must not transmit to devices/receivers outside the licence area."
    profile_field: "static_authorization scope × authorized_area; optional protection_entitlement for licensed use"
    mechanisms:
      - static_authorization
      - authorized_area
      - protection_entitlement
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL
    notes: "Entitlement is area×block right; not PAL/PPA class preemption."

  - id: CA-NCLL-004
    source: ISED_R3_NCLL_3900
    section: "12. Technical considerations — A1"
    summary: "Block A1 (3900–3910 MHz) is issued on a no-interference, no-protection basis vis-à-vis adjacent-band flexible use in 3650–3900 MHz."
    profile_field: "segment constraint / omit protection_entitlement for A1 vs flexible-use adjacent"
    mechanisms:
      - frequency_ranges
      - channel_exclusion
    forbid_mechanisms_for_semantics:
      - protection_entitlement
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT
    notes: "No-protection is configuration (do not invent incumbent protection for A1); fail closed if a future profile wrongly requires protection data for A1."

  - id: CA-NCLL-005
    source: ISED_SPB_001_23
    section: "Licence area geometry"
    summary: "Licence areas use custom vector-based boundaries (not a mandatory fixed national grid)."
    profile_field: "geography.mechanism=authorized_area (polygon)"
    mechanisms:
      - authorized_area
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT

  - id: CA-NCLL-006
    source: ISED_NCLL_LANDING
    section: "Area size by licence type"
    summary: "Low power area ≤15 km²; medium power area between 75 and 165 km²; only low power in urban/metro."
    profile_field: "authorized_area payload + closed licence_type × area_class selectors (not YAML DSL)"
    mechanisms:
      - authorized_area
      - rule_table
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL
    notes: "No dedicated max_area_km2 primitive; express as profile validation/data + ISED portal PROCESS."

  - id: CA-NCLL-007
    source: ISED_NCLL_LANDING
    section: "Power specifications"
    summary: "Guidance max EIRP density: low power 20 dBm/MHz; medium power 37 dBm/MHz (plus indoor/urban watt-per-block caps)."
    profile_field: "power.mechanism=rule_table (licence_class × indoor_outdoor × area_class)"
    mechanisms:
      - rule_table
      - max_power
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT
    numeric_notes:
