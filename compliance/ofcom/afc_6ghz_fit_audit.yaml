    source: OFCOM_AFC_FRAMEWORK
    section: "Max EIRP ceiling 36 dBm"
    summary: "Standard Power max permissible EIRP is 36 dBm (4 W); AFC may return lower location-specific limits."
    profile_field: "rule_table ceiling + query_assignment power result"
    mechanisms:
