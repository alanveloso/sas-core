requirements:
  - id: AFC-001
    source: OFCOM_AFC
    section: "6 GHz band"
    summary: "AFC coordinates Standard Power use in 5925–7125 MHz."
    profile_field: "spectrum.ranges"
    mechanisms:
      - frequency_ranges
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT

  - id: AFC-002
    source: OFCOM_AFC_FRAMEWORK
    section: "§3 Determination of available frequencies / max power"
    summary: "On request, AFC returns available frequencies and associated maximum power levels for a device at a location/time — the canonical query-assignment shape."
    profile_field: "authorization.mechanism=query_assignment (deferred; not registered)"
    mechanisms: []
    deferred_mechanisms:
      - query_assignment
    code_plugin: null
    test: "MATRIX_TEST"
    status: GAP_PRIMITIVE
    fit_verdict: GAP
    notes: "Named in D9; not in builtin_mechanism_registry. Do not fake via Grant or SpectrumInquiryResponse as universal nouns."

  - id: AFC-003
    source: OFCOM_AFC_FRAMEWORK
    section: "§3.2 Query inputs"
    summary: "Availability depends on device location, technical parameters, and protected-system data — not a pre-issued static local licence alone."
    profile_field: "query_assignment inputs; static_authorization insufficient as sole mechanism"
    mechanisms: []
    deferred_mechanisms:
      - query_assignment
    forbid_mechanisms_for_semantics:
      - static_authorization
    code_plugin: null
    test: "MATRIX_TEST"
    status: GAP_PRIMITIVE
    fit_verdict: GAP
    notes: "static_authorization remains valid for other regimes; AFC primary path is query-driven."

  - id: AFC-004
    source: ARCH_G0_005
    section: "D7 / D9"
    summary: "Must not promote CBRS Grant/CBSD or Spectrum Inquiry protocol types as the generic AFC model."
    profile_field: "query_assignment (generic); CBRS SIQ stays CBRS adapter"
    mechanisms: []
    deferred_mechanisms:
      - query_assignment
    forbid_domain_nouns:
      - Grant
      - CBSD
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_EXISTING
    fit_verdict: FIT
    notes: "CBRS Spectrum Inquiry may share RF math; it is not the universal query_assignment contract."

  - id: AFC-005
    source: ARCH_G0_005
    section: "D9 availability_constraint vs query_assignment"
    summary: "eLSA availability_constraint (push/zone validity) is registered; AFC pull query is a distinct authorization-family mechanism."
    profile_field: "do not overload availability_constraint for AFC queries"
    mechanisms:
      - availability_constraint
    deferred_mechanisms:
      - query_assignment
    code_plugin: null
    test: "MATRIX_TEST"
    status: FIT_PARTIAL
    fit_verdict: PARTIAL
    notes: "Both are authorization-family; roles differ (zone/event vs location query)."

  - id: AFC-006
    source: OFCOM_AFC_FRAMEWORK
    section: "Protected services"
    summary: "Protect fixed links, radio astronomy, and other services in Ofcom licence data (incl. non-published stations)."
    profile_field: "protection + data.protected_entities; Ofcom 6 GHz extract API"
    mechanisms:
      - protection_entitlement
      - distance_exclusion
      - exclusion_zone
      - channel_exclusion
      - single_link_threshold
      - path_loss
    data_capabilities:
      - protected_entities
      - boundaries
      - reference_data
    code_plugin: "providers; Ofcom secure extract not in-repo"
    test: "MATRIX_TEST"
    status: GAP_DATA
    fit_verdict: GAP

  - id: AFC-007
    source: OFCOM_AFC_FRAMEWORK
    section: "Geolocation capability"
    summary: "Standard Power devices must provide geographic coordinates and location uncertainty (metres) at 95% confidence."
    profile_field: "device adapter capability geolocation; not a core singleton"
    mechanisms:
